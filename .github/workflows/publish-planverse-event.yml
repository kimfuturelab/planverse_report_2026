name: Publish Planverse Event Landing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-planverse-event.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: planverse-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout event branch
        uses: actions/checkout@v4
        with:
          ref: event-landing-2026
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload event landing
        uses: actions/upload-pages-artifact@v3
        with:
          path: event-landing-2026
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
